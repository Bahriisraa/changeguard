server:
  port: 8083

spring:
  application:
    name: approval-service
  datasource:
    url: jdbc:postgresql://${APPROVAL_DB_HOST:approval-db}:5432/${APPROVAL_DB_NAME}
    username: ${APPROVAL_DB_USER}
    password: ${APPROVAL_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health

freeze:
  start: ${FREEZE_START:}
  end: ${FREEZE_END:}